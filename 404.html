<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
        }

        img {
            width: 220px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 72px;
            color: #f85149;
        }

        h2 {
            font-weight: 400;
            margin: 10px 0;
        }

        p {
            color: #8b949e;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #30363d;
            color: #c9d1d9;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.3s;
        }

        a:hover {
            background: #21262d;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Gambar (bisa ganti sesuai selera) -->
        <img src="https://cdn-icons-png.flaticon.com/512/6195/6195678.png" alt="404 image">

        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you’re looking for doesn’t exist or has been moved.</p>

        <a href="/">← Back to Home</a>
    </div>

</body>
</html>
